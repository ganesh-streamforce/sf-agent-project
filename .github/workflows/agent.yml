name: Jira Agent

on:
  workflow_dispatch:
    inputs:
      ticket_key:
        description: 'Jira ticket key'
        required: true

jobs:
  agent-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Create working branch
        run: git checkout -b agent/${{ github.event.inputs.ticket_key }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Get Salesforce Access Token
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.SF_INSTANCE_URL }}/services/oauth2/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.SF_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SF_CLIENT_SECRET }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to obtain Salesforce access token."
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "SF_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Login to Salesforce
        run: |
          sf org login access-token \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --no-prompt
        env:
          SF_ACCESS_TOKEN: ${{ env.SF_ACCESS_TOKEN }}

      - name: Verify Salesforce Connection
        run: sf org display --target-org target-org

      - name: Install Teamwork Graph CLI
        run: |
          echo "yes" | bash <(curl -fsSL https://teamwork-graph.atlassian.com/cli/install) \
            --skip-login

      - name: Verify TWG
        run: twg doctor
        env:
          TWG_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TWG_USER: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run AI Agent
        uses: anthropics/claude-code-action@v1

        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: ${{ vars.OPENROUTER_MODEL }}

          TWG_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TWG_USER: ${{ secrets.JIRA_USER_EMAIL }}

        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          show_full_output: true

          prompt: |
            You are an experienced Salesforce Developer working in this repository.

            Your goal is to complete Jira ticket:

            ${{ github.event.inputs.ticket_key }}

            --------------------------------------------------
            PHASE 1 — Understand the Project
            --------------------------------------------------

            Read AGENTS.md first.

            Understand:

            • Project architecture
            • Folder structure
            • Coding standards
            • Deployment process
            • Existing implementation
            • Previous agent learnings

            Do not begin implementation until you fully understand the project.

            --------------------------------------------------
            PHASE 2 — Understand the Jira Requirement
            --------------------------------------------------

            Use the available Teamwork Graph tools to gather the complete
            context for Jira ticket:

            ${{ github.event.inputs.ticket_key }}

            Understand:

            • Requirement
            • Acceptance Criteria
            • Description
            • Comments
            • Parent / Epic
            • Linked Issues
            • Related Pull Requests
            • Documentation
            • Dependencies

            Before changing code, summarize the requirement internally and
            identify the work that needs to be completed.

            --------------------------------------------------
            PHASE 3 — Plan
            --------------------------------------------------

            Before making any code changes:

            • Identify affected files.
            • Identify impacted Salesforce metadata.
            • Determine required Apex, LWC, Flow, Object or Permission changes.
            • Plan deployment and testing.

            Only modify files required for this ticket.

            Do NOT:

            • Refactor unrelated code.
            • Rename files unnecessarily.
            • Change formatting without reason.
            • Make unrelated improvements.

            --------------------------------------------------
            PHASE 4 — Implement
            --------------------------------------------------

            Implement the requested Salesforce changes.

            Deploy the changes to Salesforce Org:

            target-org

            Run validation and Apex tests.

            Verify:

            ✓ Deployment completed successfully

            ✓ Apex tests passed

            ✓ No deployment errors

            --------------------------------------------------
            PHASE 5 — Success
            --------------------------------------------------

            If everything succeeds:

            1. Update AGENTS.md.

            Add at most five concise lines under "Recent Changes"
            including:

            • Date
            • Jira Ticket
            • Components changed
            • Important implementation notes

            2. Commit the changes.

            3. Push the working branch.

            4. Create a Pull Request including:

            • Summary
            • Files changed
            • Deployment result
            • Test results

            5. Post a progress update back to the Jira ticket using
            the available Teamwork Graph tools.

            --------------------------------------------------
            PHASE 6 — Failure
            --------------------------------------------------

            If any of the following fails:

            • Salesforce authentication
            • Jira access
            • Deployment
            • Apex tests
            • Git push
            • Pull Request creation

            Stop immediately.

            Do NOT:

            • Commit changes
            • Push code
            • Create a Pull Request
            • Update AGENTS.md

            Post a detailed explanation back to the Jira ticket including:

            • What failed
            • Possible cause
            • Recommended next steps

        claude_args: >-
          --allowedTools "Bash,Read,Write,Edit"
          --max-turns 75
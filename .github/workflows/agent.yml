name: Jira Agent

on:
  workflow_dispatch:
    inputs:
      ticket_key:
        description: 'Jira ticket key'
        required: true

jobs:
  agent-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Create branch
        run: git checkout -b agent/${{ github.event.inputs.ticket_key }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Get access token (Client Credentials flow)
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.SF_INSTANCE_URL }}/services/oauth2/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.SF_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SF_CLIENT_SECRET }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token. Response was:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "SF_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Register org with sf CLI
        run: |
          sf org login access-token \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --no-prompt
        env:
          SF_ACCESS_TOKEN: ${{ env.SF_ACCESS_TOKEN }}

      - name: Confirm Salesforce connection
        run: sf org display --target-org target-org

      - name: Derive Jira site from JIRA_BASE_URL
        run: |
          SITE=$(echo "${{ secrets.JIRA_BASE_URL }}" | sed -E 's|https?://([^.]+)\..*|\1|')
          echo "TWG_SITE=$SITE" >> "$GITHUB_ENV"
          echo "Using Jira site: $SITE"

      - name: Install TWG CLI
        run: |
          echo "yes" | bash <(curl -fsSL https://teamwork-graph.atlassian.com/cli/install) \
            --skip-login

      - name: Copy TWG skills into project
        run: |
          mkdir -p .agents/skills
          cp -r ~/.agents/skills/twg* .agents/skills/
          echo "TWG skills installed:"
          ls -d .agents/skills/twg*

      - name: Verify TWG CLI
        run: twg --version

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run Claude Code agent
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: ${{ vars.OPENROUTER_MODEL }}
          TWG_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TWG_USER: ${{ secrets.JIRA_USER_EMAIL }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          show_full_output: true
          prompt: |
            You have a limited number of turns — be efficient with every
            one. Read files once and reuse what you learn. Do not refactor
            or explore unrelated code.

            ### PHASE 1 — Load project knowledge
            Read AGENTS.md to understand the project's structure,
            conventions, and known gotchas.

            ### PHASE 2 — Gather Jira Context
            Use the installed Teamwork Graph (TWG) capabilities to gather the complete
            context for Jira ticket
            Prompt : Tell me everything about ${{ github.event.inputs.ticket_key }}

            Before making any code changes, summarize the complete requirement
            internally and identify exactly what needs to be implemented.

            If additional context is required, continue exploring the related
            Jira items until the requirement is fully understood.
            
            ### PHASE 2b — Create and execute subtasks
            If this ticket needs multiple deliverables, create subtasks —
            one per distinct deliverable. Assign each to yourself and
            work through them one by one:

              1. Create subtask assigned to you:
                 twg jira workitem create \
                   --space <PROJECT_KEY> \
                   --type "Sub-task" \
                   --summary "<deliverable title>" \
                   --parent ${{ github.event.inputs.ticket_key }} \
                   --assignee "me"

              2. Implement that subtask completely.

              3. Mark it done by posting a completion comment:
                 twg jira workitem comment create \
                   --issue-id <SUBTASK_KEY> \
                   --body-format markdown \
                   --body 'Completed: <what was done>'

              4. Move to the next subtask and repeat steps 2-3.

            Only after ALL subtasks are complete, move to Phase 3.

            ### PHASE 3 — Implement
            Make the required Salesforce admin/developer changes in this
            SFDX project on the current branch. Deploy to org alias
            "target-org" and run local Apex tests before committing
            anything.

            ### PHASE 4 — Success path
            If everything passes:
              - Update AGENTS.md with anything a future run would benefit
                from knowing (new conventions, gotchas hit, objects or
                fields touched). Keep it brief — at most 5 new lines under
                "Recent changes", dated and referencing this ticket. Do
                not restate anything already documented.
              - Commit code changes and the AGENTS.md update together,
                push the branch, and open a pull request summarizing what
                changed and why.
              - Post a progress comment on the Jira ticket using:
                twg jira workitem comment create \
                  --issue-id ${{ github.event.inputs.ticket_key }} \
                  --body-format markdown \
                  --body '<your comment here>'

            ### PHASE 5 — Failure path
            If validation fails, or you are unsure whether a change is safe:
              - Do not modify AGENTS.md.
              - Do not commit, push, or open a PR.
              - Post a comment on the Jira ticket explaining exactly what
                failed or what you were unsure about (use the same twg
                comment create command as above).
          claude_args: >-
            --allowedTools "Bash,Edit,Read,Write"
            --max-turns 75
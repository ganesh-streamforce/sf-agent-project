name: Jira Agent

on:
  workflow_dispatch:
    inputs:
      ticket_key:
        description: 'Jira ticket key'
        required: true

jobs:
  agent-run:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Create working branch
        run: git checkout -b agent/${{ github.event.inputs.ticket_key }}

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Authenticate to Salesforce
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.SF_INSTANCE_URL }}/services/oauth2/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.SF_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SF_CLIENT_SECRET }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "SF_ACCESS_TOKEN=$ACCESS_ENV"

      - name: Register Salesforce Org
        run: |
          sf org login access-token \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --no-prompt
        env:
          SF_ACCESS_TOKEN: ${{ env.SF_ACCESS_TOKEN }}

      - name: Verify Salesforce
        run: sf org display --target-org target-org

      - name: Install Teamwork Graph CLI
        run: |
          echo yes | bash <(curl -fsSL https://teamwork-graph.atlassian.com/cli/install)

      - name: Verify TWG
        run: twg doctor

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run AI Agent
        uses: anthropics/claude-code-action@v1

        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: ${{ vars.OPENROUTER_MODEL }}

          TWG_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          TWG_USER: ${{ secrets.JIRA_USER_EMAIL }}

        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          show_full_output: true

          prompt: |
            You are an experienced Salesforce Developer working on this repository.

            Your objective is to complete Jira ticket:
            ${{ github.event.inputs.ticket_key }}

            -------------------------
            PHASE 1 — Understand Project
            -------------------------

            Read AGENTS.md first.

            Understand:

            • Project architecture
            • Folder structure
            • Coding conventions
            • Deployment process
            • Existing implementation
            • Previous agent learnings

            Do not begin implementation until the project is understood.

            -------------------------
            PHASE 2 — Understand Jira
            -------------------------

            Use the installed TWG skills to gather complete context for
            ticket:

            ${{ github.event.inputs.ticket_key }}

            Understand:

            • Requirement
            • Acceptance Criteria
            • Description
            • Comments
            • Parent/Epic
            • Related Issues
            • Linked Pull Requests
            • Documentation
            • Dependencies

            Before changing code, summarize the requirement internally.

            -------------------------
            PHASE 3 — Plan
            -------------------------

            Identify:

            • Files that must change
            • Metadata affected
            • Apex classes
            • Lightning components
            • Flows
            • Objects
            • Tests

            Only modify files required for this ticket.

            Do NOT:

            • Refactor unrelated code
            • Rename files
            • Change formatting unnecessarily
            • Introduce unrelated improvements

            -------------------------
            PHASE 4 — Implement
            -------------------------

            Implement the requested Salesforce changes.

            Deploy to Salesforce Org alias:

            target-org

            Run validation and Apex tests.

            Verify:

            ✓ Deployment succeeded

            ✓ Tests passed

            ✓ No deployment errors

            -------------------------
            PHASE 5 — Success
            -------------------------

            If everything succeeds:

            1. Update AGENTS.md

            Add at most five concise lines under
            "Recent Changes".

            Include:

            • Date
            • Jira Ticket
            • Objects changed
            • Important implementation notes

            2. Commit changes.

            3. Push branch.

            4. Create Pull Request.

            Include:

            • Summary
            • Files changed
            • Deployment result
            • Test results

            5. Post a progress update back to the Jira ticket using the
            installed TWG skills.

            -------------------------
            PHASE 6 — Failure
            -------------------------

            If any step fails:

            • Deployment
            • Tests
            • Salesforce authentication
            • Jira access
            • Git push
            • Pull Request creation

            Stop immediately.

            Do not commit.

            Do not create a Pull Request.

            Do not update AGENTS.md.

            Post a detailed explanation back to the Jira ticket including:

            • What failed
            • Possible cause
            • Recommended next action

          claude_args: >-
            --allowedTools "Bash,Read,Write,Edit"
            --max-turns 75
name: Test Connections

on:
  workflow_dispatch:
    inputs:
      ticket_key:
        description: 'Jira ticket key to test-read'
        required: true

jobs:
  test-salesforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install -g @salesforce/cli

      - name: Get access token (Client Credentials flow)
        run: |
          RESPONSE=$(curl -s -X POST "${{ secrets.SF_INSTANCE_URL }}/services/oauth2/token" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.SF_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.SF_CLIENT_SECRET }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r .access_token)

          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token. Response was:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "::add-mask::$ACCESS_TOKEN"
          echo "SF_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Register org with sf CLI
        run: |
          sf org login access-token \
            --instance-url "${{ secrets.SF_INSTANCE_URL }}" \
            --alias target-org \
            --no-prompt
        env:
          SF_ACCESS_TOKEN: ${{ env.SF_ACCESS_TOKEN }}

      - name: Confirm connection
        run: sf org display --target-org target-org

      - name: Run a trivial query
        run: |
          sf data query \
            --query "SELECT Id, Name FROM Organization LIMIT 1" \
            --target-org target-org

  test-jira:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      
      - name: Debug - test mcp-atlassian directly
        run: uvx mcp-atlassian --help
        env:
          JIRA_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USERNAME: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      
      - name: Debug - test Jira credentials directly
        run: |
          curl -s -u "${{ secrets.JIRA_USER_EMAIL }}:${{ secrets.JIRA_API_TOKEN }}" \
            "${{ secrets.JIRA_BASE_URL }}/rest/api/3/issue/TPDC-6?fields=summary,description,status" \
            | jq .
        
      - name: Run Claude Code — read-only Jira test
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: ${{ vars.OPENROUTER_MODEL }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          prompt: |
            Using the Jira MCP tools, fetch ticket
            ${{ github.event.inputs.ticket_key }} and print back:
            - its title
            - its full description
            - its current status
            Do not edit, create, or delete any files. Do not run any git
            or bash commands. Do not post any comment to the ticket. This
            is a read-only connectivity test — just report what you found.
          claude_args: >-
            --mcp-config ../../.mcp.json
            --allowedTools "Read,mcp__jira__*"
            --max-turns 5
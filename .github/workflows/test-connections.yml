name: Test MCP Tools

on:
  workflow_dispatch:

jobs:
  list-mcp-tools:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Verify mcp-atlassian installation
        run: |
          uvx mcp-atlassian --help

      - name: Run Claude Code - List MCP Tools
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: ${{ vars.OPENROUTER_MODEL }}

          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          show_full_output: true

          prompt: |
            This is a read-only MCP capability inspection.

            Before calling any tools:

            1. List every MCP tool currently available.
            2. Print:
               - Tool name
               - Description
               - Required parameters
            3. Specifically indicate whether tools exist for:
               - Listing Jira attachments
               - Downloading attachments
               - Reading attachment contents
               - Reading Confluence pages
               - Searching issues
               - Creating issues
               - Creating comments
               - Updating issues
               - Transitions
               - JQL search

            After listing the tools, stop.

            Do NOT call any tool.
            Do NOT read any Jira ticket.
            Do NOT modify anything.
            Only print the available MCP tool inventory.

          claude_args: >-
            --mcp-config .mcp.json
            --allowedTools "mcp__jira__*"
            --max-turns 3
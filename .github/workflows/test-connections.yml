name: Test MCP Tools

on:
  workflow_dispatch:

jobs:
  list-mcp-tools:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Verify mcp-atlassian installation
        run: |
          uvx mcp-atlassian --help

      - name: Run Claude Code - List MCP Tools
        uses: anthropics/claude-code-action@v1
        env:
          ANTHROPIC_BASE_URL: https://openrouter.ai/api
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ""
          ANTHROPIC_MODEL: ${{ vars.OPENROUTER_MODEL }}

          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        with:
          anthropic_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          show_full_output: true

          prompt: |
            This is a read-only MCP capability inspection.

            Your task is to discover every MCP tool exposed by the configured MCP servers.

            You may use read-only MCP inspection tools and read the .mcp.json configuration file if needed.

            Do NOT modify any files.
            Do NOT create, edit, or delete Jira issues.
            Do NOT create comments.
            Do NOT make any changes to the repository.

            Output a table containing:

            - Tool name
            - Description
            - Required parameters
            - Whether it is read-only or modifies data

            Specifically identify whether tools exist for:

            - Listing Jira attachments
            - Downloading attachments
            - Reading attachment contents
            - Reading Confluence pages
            - Searching issues (JQL)
            - Creating issues
            - Updating issues
            - Creating comments
            - Transitioning issues

            After listing the available tools, stop.

          claude_args: >-
            --mcp-config .mcp.json
            --allowedTools "mcp__jira__*"
            --max-turns 30
